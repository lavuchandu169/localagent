name: CI

# Runs the build + full test suite on every push and pull request against
# main. Separate from release.yml (which is tag-triggered and handles the
# actual build/sign/publish): this is the fast, cheap gate that every
# ordinary commit goes through, so a broken change can't land on main in
# the first place, let alone reach a release tag.

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
