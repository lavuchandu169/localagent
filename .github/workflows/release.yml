name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  # Creates the GitHub Release for this tag exactly once, before either
  # build job starts. Without this, build-mac and build-win each call
  # electron-builder's `--publish always`, which internally does a
  # find-or-create against the tag — running in parallel, both jobs found
  # nothing and each created its own release, splitting the mac/win assets
  # across two separate releases (observed on 3/3 releases so far, fixed by
  # hand each time). Both build jobs now `needs: create-release`, so the
  # release already exists by the time either one runs and electron-builder
  # just finds it and appends assets, instead of racing to create it.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$PKG_VERSION"
            exit 1
          fi
      - name: Create the release up front (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping creation."
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "${GITHUB_REF_NAME#v}" --notes "" --prerelease
          fi

  build-mac:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$PKG_VERSION"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:mac -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID_EMBED: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID_EMBED }}
          GOOGLE_OAUTH_CLIENT_SECRET_EMBED: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET_EMBED }}

  build-win:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$PKG_VERSION"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID_EMBED: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID_EMBED }}
          GOOGLE_OAUTH_CLIENT_SECRET_EMBED: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET_EMBED }}
