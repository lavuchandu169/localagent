name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  # Blocks the entire release — including create-release's empty shell — on
  # the test suite actually passing. Previously nothing in CI ran `npm
  # test` at all: every one of this project's betas shipped only because a
  # human ran the suite locally before pushing the tag. A bad tag push with
  # no local check would have published untested code with nothing to stop
  # it. Runs on ubuntu-latest (cheapest) since the suite is plain Node
  # scripts against MockProvider/fake resolvers — no Electron or real
  # model loading involved.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Creates the GitHub Release for this tag exactly once, before either
  # build job starts. Without this, build-mac and build-win each call
  # electron-builder's `--publish always`, which internally does a
  # find-or-create against the tag — running in parallel, both jobs found
  # nothing and each created its own release, splitting the mac/win assets
  # across two separate releases (observed on 3/3 releases so far, fixed by
  # hand each time). Both build jobs now `needs: create-release`, so the
  # release already exists by the time either one runs and electron-builder
  # just finds it and appends assets, instead of racing to create it.
  # Needs `test` too, not just the build jobs — a failing suite must mean
  # NO release object appears at all, not an empty one with no assets.
  create-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$PKG_VERSION"
            exit 1
          fi
      - name: Create the release up front (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping creation."
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "${GITHUB_REF_NAME#v}" --notes "" --prerelease
          fi

  build-mac:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$PKG_VERSION"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare signing/notarization environment
        shell: bash
        # GitHub Actions' `env: X: ${{ secrets.Y }}` always defines X as an
        # empty string when the secret doesn't exist — it never omits the
        # variable. electron-builder's CSC_LINK handling treats that empty
        # string as "a path was given" and tries to resolve it, landing on
        # the job's working directory itself ("... not a file") instead of
        # skipping signing. Verified locally: with these truly unset,
        # electron-builder correctly logs "skipped macOS application code
        # signing" and continues; with them set to "", it hard-fails. This
        # step only ever writes a name to $GITHUB_ENV when the secret is
        # genuinely non-empty, so the variable is either real or fully
        # absent for the next step — never present-but-empty.
        run: |
          set_if_present() {
            if [ -n "$2" ]; then
              echo "$1=$2" >> "$GITHUB_ENV"
            fi
          }
          set_if_present CSC_LINK "${{ secrets.CSC_LINK }}"
          set_if_present CSC_KEY_PASSWORD "${{ secrets.CSC_KEY_PASSWORD }}"
          set_if_present APPLE_API_KEY "${{ secrets.APPLE_API_KEY }}"
          set_if_present APPLE_API_KEY_ID "${{ secrets.APPLE_API_KEY_ID }}"
          set_if_present APPLE_API_ISSUER "${{ secrets.APPLE_API_ISSUER }}"
          set_if_present APPLE_TEAM_ID "${{ secrets.APPLE_TEAM_ID }}"
          set_if_present APPLE_ID "${{ secrets.APPLE_ID }}"
          set_if_present APPLE_APP_SPECIFIC_PASSWORD "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
      - run: npm run package:mac -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID_EMBED: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID_EMBED }}
          GOOGLE_OAUTH_CLIENT_SECRET_EMBED: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET_EMBED }}

  build-win:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$PKG_VERSION"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare signing environment
        shell: bash
        # Same reasoning as build-mac's equivalent step: only ever define
        # these when the secret is genuinely non-empty, so
        # scripts/sign-windows.mjs's own "is this set" check (and whatever
        # real SSL.com call eventually replaces its stub) never has to
        # distinguish "unset" from "empty string" — it's just unset.
        run: |
          set_if_present() {
            if [ -n "$2" ]; then
              echo "$1=$2" >> "$GITHUB_ENV"
            fi
          }
          set_if_present ES_USERNAME "${{ secrets.ES_USERNAME }}"
          set_if_present ES_PASSWORD "${{ secrets.ES_PASSWORD }}"
          set_if_present CREDENTIAL_ID "${{ secrets.CREDENTIAL_ID }}"
          set_if_present ES_TOTP_SECRET "${{ secrets.ES_TOTP_SECRET }}"
      - run: npm run package:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID_EMBED: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID_EMBED }}
          GOOGLE_OAUTH_CLIENT_SECRET_EMBED: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET_EMBED }}
